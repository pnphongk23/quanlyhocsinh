appId: com.study.teacherthu
name: ios-guardian-login
---
- tapOn:
    id: login.phone
- eraseText: 30
- inputText: ${GUARDIAN_PHONE}
- tapOn:
    id: login.password
- eraseText: 30
- inputText: ${GUARDIAN_PASSWORD}
- tapOn:
    id: login.submit
- extendedWaitUntil:
    visible:
      id: guardian.dashboard
    timeout: 45000
