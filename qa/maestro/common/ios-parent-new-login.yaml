appId: com.study.teacherthu
name: ios-parent-new-login
---
- tapOn:
    id: login.phone
- eraseText: 30
- inputText: ${QA_PARENT_NEW_PHONE}
- tapOn:
    id: login.password
- eraseText: 30
- inputText: ${QA_PARENT_NEW_PASSWORD}
- tapOn:
    id: login.submit
- extendedWaitUntil:
    visible:
      id: guardian.dashboard
    timeout: 45000
