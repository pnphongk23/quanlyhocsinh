appId: com.study.teacherthu
name: ios-tc-cmt-017
tags: [ios, comments, p0]
# Fixture: QA-iOS-P0-Student-1. Synthetic input only; never use real parent feedback.
# Spec: không giới hạn ký tự, không bộ đếm (Q-16). Runtime dependency: iOS text-selection menu label may be localized; confirm by hierarchy.
---
- runFlow:
    file: ../../common/ios-open-shared-session.yaml
- tapOn:
    id: session.tab.comments
- tapOn:
    id: comment.row.QA-iOS-P0-Student-1
- longPressOn:
    id: comment.sentence
- tapOn: Chọn tất cả
- inputText: ""
- assertNotVisible:
    id: comment.tooLong
- assertNotVisible:
    id: comment.counter
- copyTextFrom:
    id: comment.sentence
- assertTrue: ${maestro.copiedText.length == 1000}
- tapOn:
    id: comment.save
- assertNotVisible:
    id: comment.tooLong
- assertVisible: "Đã lưu"
