appId: com.study.teacherthu
name: ios-tc-cls-006-generated-session-date-format
tags: [ios, classes, p0]
---
- launchApp
- tapOn:
    text: "Lớp"
- extendedWaitUntil:
    visible: "Lớp của tôi"
    timeout: 30000
- swipe:
    start: 50%, 30%
    end: 50%, 85%
    duration: 600
- scrollUntilVisible:
    element:
      text: "QA-iOS-20261025-CLS-P0-R4"
    direction: DOWN
- tapOn:
    text: "QA-iOS-20261025-CLS-P0-R4"
- extendedWaitUntil:
    visible: "Buổi học"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: /^(?:T[2-7]|CN) · \d{2}\/\d{2}$/
    direction: DOWN
- assertVisible:
    text: /^(?:T[2-7]|CN) · \d{2}\/\d{2}$/
- assertNotVisible:
    text: /Buổi \d+/i
- assertNotVisible:
    id: saveStatus.error
- back
