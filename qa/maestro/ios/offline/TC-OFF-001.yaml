appId: com.study.teacherthu
name: ios-tc-off-001
tags: [ios, offline, p0]
# Preconditions: QA-iOS fixture is prepared in the staging smoke workspace.
# Waiting for IDs: session.tab.attendance, attendance.row.QA-iOS-P0-Student-1.present, attendance.save, saveStatus.loading, saveStatus.synced, saveStatus.pendingCount
---
- runFlow:
    file: ../../common/ios-open-shared-session.yaml
- tapOn:
    id: session.tab.attendance
- tapOn:
    id: attendance.row.QA-iOS-P0-Student-1.present
- tapOn:
    id: attendance.save
- assertVisible:
    id: saveStatus.loading
- waitForAnimationToEnd
- assertVisible:
    id: saveStatus.synced
- assertNotVisible:
    id: saveStatus.pendingCount
- assertNotVisible:
    id: saveStatus.error
