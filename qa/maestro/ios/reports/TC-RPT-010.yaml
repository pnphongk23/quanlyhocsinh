appId: com.study.teacherthu
name: ios-tc-rpt-010
tags: [ios, reports, p0]
# Preconditions: QA-iOS fixture is prepared in the staging smoke workspace.
# Waiting for IDs: class.tab.reports, report.releaseClass, report.release.confirm, report.status.allPublished, guardian.tab.reports, guardian.report.list.published
---
- runFlow:
    file: ../../common/ios-open-shared-class.yaml
- tapOn:
    id: class.tab.reports
- tapOn:
    id: report.releaseClass
- tapOn:
    id: report.release.confirm
- assertVisible:
    id: report.status.allPublished
- runFlow:
    file: ../../common/ios-logout.yaml
- runFlow:
    file: ../../common/ios-guardian-entry.yaml
- tapOn:
    id: guardian.tab.reports
- assertVisible:
    id: guardian.report.list.published
