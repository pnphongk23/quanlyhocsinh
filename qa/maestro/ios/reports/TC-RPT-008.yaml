- tapOn:
    id: class.tab.reports
- tapOn:
    id: report.draft.QA-iOS-P0-Student-1
- tapOn:
    id: report.comment
- inputText: QA-iOS report note
- tapOn:
    id: report.comment.save
- assertVisible:
    id: report.comment.saveStatus.synced
- tapOn:
    id: report.preview
- assertVisible:
    id: report.preview.sheet
- assertVisible:
    id: report.preview.comment
