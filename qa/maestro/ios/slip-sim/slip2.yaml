appId: com.study.teacherthu
---
- launchApp:
    stopApp: true
- tapOn: "Lớp Smoke FB2"
- tapOn: "Điểm danh"
- tapOn: "Nhận xét"
- tapOn: "Bé An"
- extendedWaitUntil:
    visible:
      id: comment.stars
    timeout: 10000
- assertVisible: "QA gõ thêm iOS"
- assertVisible: ".*3/5 sao.*"
- assertNotVisible: "Theo chấm BTVN"
- assertNotVisible:
    id: comment.unsaved
- takeScreenshot: /Users/phamnhuphong/Git/quanlyhocsinh/plans/20261021-mvp/ios/ux-v3-mobile-fix/shots/qa-slip/20-slip-reopened
- tapOn:
    id: comment.note
- eraseText: 60
- inputText: ""
- tapOn: "Nhận xét gửi phụ huynh"
- assertNotVisible:
    id: comment.counter
- assertNotVisible:
    id: comment.tooLong
- takeScreenshot: /Users/phamnhuphong/Git/quanlyhocsinh/plans/20261021-mvp/ios/ux-v3-mobile-fix/shots/qa-slip/21-slip-long-note
- tapOn:
    id: comment.save
- extendedWaitUntil:
    visible: "Đã lưu"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: /Users/phamnhuphong/Git/quanlyhocsinh/plans/20261021-mvp/ios/ux-v3-mobile-fix/shots/qa-slip/22-slip-long-saved
