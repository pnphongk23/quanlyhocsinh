appId: com.study.teacherthu
name: ios-tc-tst-003
tags: [ios, tests, p0]
# Preconditions: QA-iOS-P0-Test-1 exists with four visible students.
# Waiting for IDs: class.tab.tests, test.row.QA-iOS-P0-Test-1, test.score.QA-iOS-P0-Student-1..4, test.score.error.step, test.score.error.range, test.score.save
---
- runFlow:
    file: ../../common/ios-open-shared-class.yaml
- tapOn:
    id: class.tab.tests
- tapOn:
    id: test.row.QA-iOS-P0-Test-1
- tapOn:
    id: test.score.QA-iOS-P0-Student-1
- inputText: "12.5"
- tapOn:
    id: test.score.QA-iOS-P0-Student-2
- inputText: "0"
- tapOn:
    id: test.score.QA-iOS-P0-Student-3
- inputText: "15"
- tapOn:
    id: test.score.QA-iOS-P0-Student-4
- inputText: "12.3"
- assertVisible:
    id: test.score.error.step
- tapOn:
    id: test.score.QA-iOS-P0-Student-4
- eraseText: 8
- inputText: "1001"
- assertVisible:
    id: test.score.error.range
- tapOn:
    id: test.score.QA-iOS-P0-Student-4
- eraseText: 8
- inputText: "-1"
- assertVisible:
    id: test.score.error.range
- tapOn:
    id: test.score.save
- assertVisible:
    id: test.score.QA-iOS-P0-Student-1.saved12_5
- assertVisible:
    id: test.score.QA-iOS-P0-Student-2.saved0
- assertVisible:
    id: test.score.QA-iOS-P0-Student-3.saved15
