name: CI

on:
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect changed areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          worker=false
          web=false
          ios=false
          while IFS= read -r path; do
            case "$path" in
              worker/*) worker=true ;;
              src/*|public/*|package.json|package-lock.json|package*.json|vite.config.*|scripts/*) web=true ;;
              ios/*) ios=true ;;
            esac
          done <<< "$changed_files"
          {
            echo "worker=$worker"
            echo "web=$web"
            echo "ios=$ios"
          } >> "$GITHUB_OUTPUT"

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: xcodegen generate
      - name: Test on an available iOS Simulator
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for runtime,group in data["devices"].items() if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-") for d in group if d["isAvailable"] and d["name"].startswith("iPhone")]; devices.sort(key=lambda d: d["name"], reverse=True); print(devices[0]["udid"] if devices else "")')"
          test -n "$simulator_id"
          xcodebuild test -scheme QuanLyLop -destination "platform=iOS Simulator,id=$simulator_id" CODE_SIGNING_ALLOWED=NO
