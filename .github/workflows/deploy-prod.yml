name: Deploy production

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Record D1 Time Travel bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info qlh-staging-db --env staging | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply pending migrations and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          migration_status="$(npx wrangler d1 migrations list qlh-staging-db --env staging --remote)"
          printf '%s\n' "$migration_status"
          printf "### D1 migration status\n\n\`\`\`text\n%s\n\`\`\`\n" "$migration_status" >> "$GITHUB_STEP_SUMMARY"
          if printf '%s' "$migration_status" | grep -Fq 'No migrations to apply'; then
            echo 'No pending D1 migrations.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            npx wrangler d1 migrations apply qlh-staging-db --env staging --remote
          fi
          npx wrangler deploy --env staging

  web:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix worker
      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Pages production branch remains main, independent of the Git branch name develop/master.
          npm --prefix worker exec -- wrangler pages deploy "$GITHUB_WORKSPACE/dist" --project-name qlh-staging-web --branch main
