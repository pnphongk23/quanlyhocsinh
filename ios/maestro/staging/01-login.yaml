# Staging thật (I-6): đăng nhập bằng tài khoản demo rồi xem danh sách lớp do máy chủ trả về.
# Thông tin đăng nhập KHÔNG nằm trong repo: truyền qua `-e` từ `/tmp/qlh-staging-demo.txt`, ví dụ
#   maestro --device <udid> test -e STAGING_PHONE=... -e STAGING_PASSWORD=... ios/maestro/staging/01-login.yaml
# `STAGING_PHONE` phải là 9 số nội địa; bỏ tiền tố 84/+84 của file demo trước khi truyền.
# Không chụp ảnh để tránh lưu dữ liệu tài khoản ngoài ý muốn.
appId: com.study.teacherthu
name: staging-login
---
- launchApp
- extendedWaitUntil:
    visible: "Đăng nhập"
    timeout: 30000
- tapOn:
    id: login.phone
- inputText: ${STAGING_PHONE}
- tapOn:
    id: login.password
- inputText: ${STAGING_PASSWORD}
- scrollUntilVisible:
    element:
      id: login.submit
    direction: DOWN
- swipe:
    start: 50%, 60%
    end: 50%, 30%
    duration: 600
- tapOn:
    id: login.submit
- extendedWaitUntil:
    visible: "Lớp của tôi"
    timeout: 45000
- assertNotVisible:
    id: saveStatus.error
