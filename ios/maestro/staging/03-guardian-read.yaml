# Read-only staging check: parent login, overview attendance card, and the newest monthly report.
# Credentials are supplied transiently from /tmp/qlh-staging-demo.txt by the runner.
appId: com.study.teacherthu
name: staging-guardian-read
---
- launchApp
- extendedWaitUntil:
    visible: "Đăng nhập"
    timeout: 30000
- tapOn:
    id: login.phone
- inputText: ${STAGING_PHONE}
- tapOn:
    id: login.password
- inputText: ${STAGING_PASSWORD}
- swipe:
    start: 50%, 60%
    end: 50%, 30%
    duration: 600
- tapOn:
    id: login.submit
- extendedWaitUntil:
    visible: "Nhận xét mới nhất"
    timeout: 45000
- assertNotVisible: "Không tải được dữ liệu của con. Vui lòng thử lại."
- assertVisible: "Đi học"
- scrollUntilVisible:
    element:
      text: "Báo cáo"
- tapOn: "Báo cáo"
- extendedWaitUntil:
    visible: "Chuyên cần"
    timeout: 20000
- assertVisible: "Bài tập về nhà"
- assertNotVisible: "Không tải được dữ liệu của con. Vui lòng thử lại."
