appId: com.study.teacherthu
name: staging-attendance-write
---
- launchApp
- extendedWaitUntil:
    visible: "Lớp của tôi"
    timeout: 30000
- tapOn:
    text: "${STAGING_CLASS_NAME}"
- extendedWaitUntil:
    visible: "${STAGING_SESSION_TITLE}"
    timeout: 20000
- tapOn:
    text: "${STAGING_SESSION_TITLE}"
- extendedWaitUntil:
    visible: "Điểm danh"
    timeout: 20000
- tapOn:
    text: "${STAGING_STUDENT_PRESENT_LABEL}"
- tapOn:
    text: "${STAGING_STUDENT_ABSENT_LABEL}"
- tapOn:
    text: "${STAGING_STUDENT_LATE_LABEL}"
- tapOn:
    text: "${STAGING_STUDENT_LATE_FIELD}"
- inputText: "18:12"
- scrollUntilVisible:
    element:
      text: "Lưu điểm danh"
    direction: DOWN
- swipe:
    start: 50%, 60%
    end: 50%, 30%
    duration: 600
- tapOn:
    text: "Lưu điểm danh"
- extendedWaitUntil:
    visible: "${STAGING_STUDENT_LATE_LABEL}"
    timeout: 45000
- assertNotVisible:
    id: saveStatus.error
