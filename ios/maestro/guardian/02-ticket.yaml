# demo: guardian
# Phụ huynh · mở phiếu buổi học mới nhất từ tab Nhận xét của cô rồi quay lại (vuốt cạnh trái) (ảnh 08 của P1).
# Chạy: ios/maestro/run.sh ios/maestro/guardian/02-ticket.yaml
appId: vn.quanlylop.app
name: guardian-ticket
---
- extendedWaitUntil:
    visible: "Nhận xét mới nhất"
    timeout: 20000
- tapOn: "Nhận xét của cô"
- extendedWaitUntil:
    visible: "Phiếu buổi học theo từng buổi: sao, câu mẫu, ghi chú và kết quả BTVN."
    timeout: 10000
- tapOn: "Mở phiếu Buổi 8"
- extendedWaitUntil:
    visible: "Nhận xét của giáo viên"
    timeout: 10000
- takeScreenshot: docs/screens/guardian/phieu-buoi-hoc-ios
- swipe:
    start: 2%, 50%
    end: 80%, 50%
- extendedWaitUntil:
    visible: "Phiếu buổi học theo từng buổi: sao, câu mẫu, ghi chú và kết quả BTVN."
    timeout: 10000
- assertVisible: "Nhận xét của cô"
