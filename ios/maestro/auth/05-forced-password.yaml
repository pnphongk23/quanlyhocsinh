# demo: forced-password
# Tài khoản · Đổi mật khẩu bắt buộc (ảnh 05) và trạng thái trùng mật khẩu tạm (ảnh 06).
# Chạy: ios/maestro/run.sh ios/maestro/auth/05-forced-password.yaml
appId: vn.quanlylop.app
name: auth-forced-password
---
- extendedWaitUntil:
    visible: "Bạn đang dùng mật khẩu tạm do giáo viên cấp. Hãy đặt mật khẩu mới để tiếp tục."
    timeout: 20000
- assertVisible: "Khác mật khẩu tạm"
- takeScreenshot: docs/screens/auth/doi-mat-khau-bat-buoc-ios
# Nhập cùng một mật khẩu vào cả ba ô: prototype hiện lỗi "không được trùng mật khẩu tạm".
# Thứ tự dưới → trên vì bàn phím che nửa dưới màn: sau khi gõ ô cuối cùng (Mật khẩu mới,
# ngay trên bàn phím) là đủ để `matchesTypedTemp` bật lỗi.
- tapOn:
    id: forced.confirm
- inputText: "mat-khau-tam-thu"
- tapOn:
    id: forced.current
- inputText: "mat-khau-tam-thu"
- tapOn:
    id: forced.new
- inputText: "mat-khau-tam-thu"
- extendedWaitUntil:
    visible: "Mật khẩu mới không được trùng mật khẩu tạm."
    timeout: 10000
- takeScreenshot: docs/screens/auth/doi-mat-khau-bat-buoc-trung-ios
