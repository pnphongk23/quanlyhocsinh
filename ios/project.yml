# Nguồn chuẩn của dự án Xcode. Sửa file này rồi chạy `xcodegen generate`.
# `QuanLyLop.xcodeproj` là file sinh ra, không commit (xem .gitignore).
#
# Môi trường: hai cấu hình Staging (debug, mặc định) và Production (release), cài đặt
# trong Config/Staging.xcconfig và Config/Production.xcconfig. Không đặt secret trong
# xcconfig; chỉ đặt URL công khai của API.
name: QuanLyLop

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: vi
  minimumXcodeGenVersion: "2.40.0"
  xcodeVersion: "16.0"

configs:
  Staging: debug
  Production: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  QuanLyLop:
    type: application
    platform: iOS
    sources:
      - path: QuanLyLop
        excludes:
          - "Resources/Info.plist"
          - "**/.gitkeep"
    configFiles:
      Staging: Config/Staging.xcconfig
      Production: Config/Production.xcconfig
    settings:
      base:
        PRODUCT_NAME: QuanLyLop
        INFOPLIST_FILE: QuanLyLop/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuanLyLop/Resources/QuanLyLop.entitlements
        # Chỉ iPhone: app ưu tiên iPhone; bản web desktop làm sau (docs/spec.md mục 8).
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Production:
          EXCLUDED_SOURCE_FILE_NAMES: "CoreFixtures.json"

  QuanLyLopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuanLyLopTests
    dependencies:
      - target: QuanLyLop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.quanlylop.app.tests
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""

schemes:
  QuanLyLop:
    build:
      targets:
        QuanLyLop: all
    run:
      config: Staging
    test:
      config: Staging
      targets:
        - QuanLyLopTests
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Production
