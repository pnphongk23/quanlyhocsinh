<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Điểm danh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button{font-family:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F6F7F9;color:#14181F;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:56px 20px 12px;display:flex;flex-direction:column;gap:12px">
    <div>
      <div style="font-size:14px;color:#4A5361">Lớp IELTS Foundation ▾ · 10 học sinh</div>
      <h1 style="margin:2px 0 0;font-size:26px;font-weight:700;letter-spacing:-0.01em">Điểm danh</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:6px">
      <button aria-label="Buổi trước" style="width:44px;height:44px;border:0;border-radius:12px;background:#F6F7F9;color:#14181F"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <div style="flex:1;text-align:center">
        <div style="font-size:16px;font-weight:600">Thứ Sáu, 16 tháng 10</div>
        <div style="font-size:14px;color:#4A5361">Buổi 18 · 18:30 – 20:00</div>
      </div>
      <button aria-label="Buổi sau" style="width:44px;height:44px;border:0;border-radius:12px;background:#F6F7F9;color:#14181F"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:14px;color:#4A5361"><b style="color:#14181F">{{present}}</b> có mặt · <b style="color:#14181F">{{late}}</b> muộn · <b style="color:#14181F">{{excused}}</b> có phép · <b style="color:#14181F">{{absent}}</b> vắng</div>
      <button onClick="{{allPresent}}" style="height:44px;padding:0 14px;border:0;border-radius:12px;background:#E8EEFE;color:#1E43B8;font-size:14px;font-weight:600">Tất cả có mặt</button>
    </div>
  </div>
  <div style="flex:1;overflow:hidden;padding:0 20px;display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{students}}" as="s" hint-placeholder-count="8">
      <div style="display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:6px 6px 6px 12px;min-height:52px">
        <div style="width:36px;height:36px;border-radius:50%;background:#E8EEFE;color:#1E43B8;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">{{s.initials}}</div>
        <div style="flex:1;font-size:16px;font-weight:500">{{s.name}}</div>
        <button onClick="{{s.cycle}}" style="{{s.btnStyle}}">{{s.label}}</button>
      </div>
    </sc-for>
  </div>
  <div style="padding:10px 20px 8px;display:flex;flex-direction:column;gap:6px">
    <div style="font-size:13px;color:#4A5361;text-align:center">Chạm vào trạng thái để đổi: Có mặt → Muộn → Có phép → Vắng</div>
    <button onClick="{{save}}" style="width:100%;height:52px;border:0;border-radius:14px;background:{{saveBg}};color:#fff;font-size:16px;font-weight:600">{{saveLabel}}</button>
  </div>
  <div style="display:flex;padding:0 4px 26px;background:#fff;border-top:1px solid #E6E9EE">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;font-size:12px;font-weight:600;color:#2F5BEA;border-top:3px solid #2F5BEA;margin-top:-1px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Điểm danh</div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;font-size:12px;font-weight:600;color:#4A5361"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Điểm số</div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;font-size:12px;font-weight:600;color:#4A5361"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Nhận xét</div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;font-size:12px;font-weight:600;color:#4A5361"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM21 21v-2a4 4 0 0 0-3-3.9"/></svg>Học sinh</div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;font-size:12px;font-weight:600;color:#4A5361"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6"/></svg>Báo cáo</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { st: { 2: 'late', 3: 'excused', 8: 'absent' }, saved: false };
  }
  renderVals() {
    const names = ['Nguyễn Minh Anh','Trần Gia Bảo','Lê Khánh Chi','Phạm Đức Dũng','Hoàng Thu Hà','Vũ Quang Huy','Đặng Ngọc Lan','Bùi Tuấn Kiệt','Ngô Bảo Ngọc','Đỗ Hải Nam'];
    const order = ['present', 'late', 'excused', 'absent'];
    const info = {
      present: ['Có mặt', 'background:#E7F6EC;color:#14663F'],
      late: ['Muộn', 'background:#FFF3D6;color:#8A5300'],
      excused: ['Có phép', 'background:#E8EEFE;color:#1E43B8'],
      absent: ['Vắng', 'background:#FDECEC;color:#B42318']
    };
    const st = this.state.st;
    const count = { present: 0, late: 0, excused: 0, absent: 0 };
    const students = names.map((name, i) => {
      const k = st[i] || 'present';
      count[k]++;
      const w = name.split(' ');
      return {
        name,
        initials: w[w.length - 2][0] + w[w.length - 1][0],
        label: info[k][0],
        btnStyle: 'min-width:92px;height:44px;border-radius:12px;border:0;font-size:15px;font-weight:600;' + info[k][1],
        cycle: () => this.setState({ saved: false, st: { ...st, [i]: order[(order.indexOf(k) + 1) % 4] } })
      };
    });
    return {
      students,
      present: count.present, late: count.late, excused: count.excused, absent: count.absent,
      allPresent: () => this.setState({ st: {}, saved: false }),
      save: () => this.setState({ saved: true }),
      saveLabel: this.state.saved ? 'Đã lưu điểm danh buổi 18' : 'Lưu điểm danh',
      saveBg: this.state.saved ? '#14663F' : '#2F5BEA'
    };
  }
}
</script>
</body>
</html>
