<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Báo cáo học tập</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button{font-family:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F6F7F9;color:#14181F;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:56px 20px 12px;display:flex;flex-direction:column;gap:12px">
    <div>
      <div style="font-size:14px;color:#4A5361">Trần Gia Bảo</div>
      <h1 style="margin:2px 0 0;font-size:26px;font-weight:700;letter-spacing:-0.01em">Báo cáo</h1>
    </div>
    <div style="display:flex;background:#E6E9EE;border-radius:12px;padding:3px">
      <button onClick="{{pickOne}}" style="{{oneStyle}}">Tháng 10</button>
      <button onClick="{{pickThree}}" style="{{threeStyle}}">3 tháng gần nhất</button>
    </div>
    <div style="font-size:14px;color:#4A5361">{{range}}</div>
  </div>
  <div style="flex:1;overflow:hidden;padding:0 20px;display:flex;flex-direction:column;gap:12px">
    <div style="background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px">
      <div style="font-size:16px;font-weight:600;margin-bottom:4px">Xem trước báo cáo</div>
      <div style="display:flex;justify-content:space-between;font-size:15px;padding:8px 0;border-top:1px solid #EEF0F3"><span>Đi học</span><b>{{attend}}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:15px;padding:8px 0;border-top:1px solid #EEF0F3"><span>Điểm trung bình</span><b>{{avg}}</b></div>
      <div style="font-size:15px;line-height:1.55;padding:8px 0;border-top:1px solid #EEF0F3"><div style="font-size:14px;color:#4A5361;margin-bottom:4px">Nhận xét chung của cô Lan</div>{{summary}}</div>
    </div>
    <div style="background:#fff;border-radius:16px;padding:6px 16px;display:flex;flex-direction:column">
      <button onClick="{{togAttend}}" style="display:flex;align-items:center;gap:12px;min-height:52px;border:0;background:transparent;text-align:left;font-size:15px;color:#14181F"><span style="{{boxAttend}}">{{tickAttend}}</span>Điểm danh &amp; chuyên cần</button>
      <button onClick="{{togScores}}" style="display:flex;align-items:center;gap:12px;min-height:52px;border:0;border-top:1px solid #EEF0F3;background:transparent;text-align:left;font-size:15px;color:#14181F"><span style="{{boxScores}}">{{tickScores}}</span>Điểm các bài kiểm tra</button>
      <button onClick="{{togNote}}" style="display:flex;align-items:center;gap:12px;min-height:52px;border:0;border-top:1px solid #EEF0F3;background:transparent;text-align:left;font-size:15px;color:#14181F"><span style="{{boxNote}}">{{tickNote}}</span>Nhận xét chung</button>
    </div>
  </div>
  <div style="padding:12px 20px 40px;display:flex;flex-direction:column;gap:8px">
    <button style="width:100%;height:52px;border:0;border-radius:14px;background:#2F5BEA;color:#fff;font-size:16px;font-weight:600">Tải PDF về máy</button>
    <div style="font-size:13px;color:#4A5361;text-align:center;line-height:1.5">Báo cáo chứa thông tin của con bạn. Chỉ chia sẻ cho người bạn tin tưởng.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { months: 1, a: true, s: true, n: true };
  }
  renderVals() {
    const m = this.state.months;
    const on = 'flex:1;height:48px;border:0;border-radius:10px;background:#fff;font-size:15px;font-weight:600;color:#14181F';
    const off = 'flex:1;height:48px;border:0;border-radius:10px;background:transparent;font-size:15px;font-weight:600;color:#4A5361';
    const box = (v) => 'width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;' + (v ? 'background:#2F5BEA' : 'background:#fff;border:2px solid #B7BEC9;box-sizing:border-box');
    const s = this.state;
    return {
      oneStyle: m === 1 ? on : off,
      threeStyle: m === 3 ? on : off,
      pickOne: () => this.setState({ months: 1 }),
      pickThree: () => this.setState({ months: 3 }),
      range: m === 1 ? '1 – 31 tháng 10, 2026' : '16 tháng 7 – 16 tháng 10, 2026',
      attend: m === 1 ? '16/18 buổi' : '47/54 buổi',
      avg: m === 1 ? '7.2/10' : '7.4/10',
      summary: m === 1 ? 'Gia Bảo tập trung tốt và làm bài đầy đủ. Cần luyện nghe thêm mỗi ngày.' : 'Ba tháng qua Gia Bảo tiến bộ ở phần viết. Cần đi học đều hơn và luyện nghe.',
      togAttend: () => this.setState({ a: !s.a }), togScores: () => this.setState({ s: !s.s }), togNote: () => this.setState({ n: !s.n }),
      boxAttend: box(s.a), boxScores: box(s.s), boxNote: box(s.n),
      tickAttend: s.a ? '✓' : '', tickScores: s.s ? '✓' : '', tickNote: s.n ? '✓' : ''
    };
  }
}
</script>
</body>
</html>
